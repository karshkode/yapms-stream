[project]
name = "elections-scraper"
version = "0.0.1"
description = "Python sidecar for YAPms OBS stream overlay. Wraps elex-clarity + per-state SoS scrapers, exposes JSON over FastAPI."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "elex-clarity>=0.0.7",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "scrapers"]
